[book]
title = "bitcoinix"
description = "NixOS modules and Nix packages for deploying security-focused Bitcoin/Lightning nodes"
language = "en"
src = "docs"

[build]
build-dir = "book"
# Fail the build when a page listed in SUMMARY.md is missing
create-missing = false

[output.html]
git-repository-url = "https://github.com/bitcoinix/bitcoinix"
# The published docs come from the latest release tag, but fixes go to master
edit-url-template = "https://github.com/bitcoinix/bitcoinix/edit/master/{path}"
