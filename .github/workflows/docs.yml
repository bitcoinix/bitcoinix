name: bitcoinix docs

# The published docs describe the latest release: they are built from the latest
# release tag, never from master. Changes on master appear with the next release.
#
# Job `build` checks that the docs of a PR build.
# Job `build_release` builds the docs of the latest release tag. On PRs it only checks
# the build, otherwise it uploads the result as a Pages artifact for job `deploy`.
#
# Deployment runs after "Verify release tags" (release.yml) has verified a pushed tag,
# or manually. `workflow_run` and `workflow_dispatch` use the workflow file from the
# default branch, so a pushed tag cannot change how it is published. Runs that can
# deploy run one at a time, so the site never goes back to an older release.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'book.toml'
      - '.github/workflows/docs.yml'
  workflow_run:
    workflows: ['Verify release tags']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Runs that can deploy share one group, so a run that selected an older tag can't
# deploy after a newer one. All other runs (PRs, the daily tag re-check) get their
# own group: a group holds a single pending run, so they would replace a pending deploy.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
         || (github.event_name == 'workflow_run'
             && github.event.workflow_run.conclusion == 'success'
             && github.event.workflow_run.event == 'push'))
        && 'docs-release' || format('docs-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build docs
        run: nix shell --inputs-from . nixpkgs#mdbook -c mdbook build

  build_release:
    # Deploy only after a tag push has been verified, not after the daily re-check.
    # Keep the deploy conditions in sync with `concurrency` above.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build the docs of the latest verified release tag
        # An explicit `shell: bash` runs with `-eo pipefail`, the default only has `-e`
        shell: bash
        run: |
          # As in release.yml: the release keys and fetch-release.sh are taken from
          # master, never from the tag being published
          git fetch -q --no-tags origin +refs/heads/master:refs/remotes/origin/master
          trusted=$RUNNER_TEMP/trusted
          mkdir -p "$trusted"
          # Full ref name: a tag named `origin/master` would win over the short name
          git archive refs/remotes/origin/master | tar -x -C "$trusted"
          echo "Trusted files from master $(git rev-parse refs/remotes/origin/master)"

          # Selects the latest vX.Y.Z tag and fails unless it is validly signed
          release=$(
            repoUrl="file://$GITHUB_WORKSPACE" \
                nix shell --inputs-from "path:$trusted" \
                    nixpkgs#{bash,coreutils,git,gnugrep,gnused,gnutar,openssh} \
                    -c bash "$trusted/helper/fetch-release.sh"
          )
          version=$(sed -nE 's/^# bitcoinix release v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' <<<"$release")
          if [[ -z $version ]]; then
              echo "::error::Could not read the release version from fetch-release.sh"
              exit 1
          fi
          echo "Building the docs of release v$version"

          src=$RUNNER_TEMP/release
          mkdir -p "$src"
          git archive "refs/tags/v$version" | tar -x -C "$src"
          nix shell --inputs-from "path:$trusted" nixpkgs#mdbook -c mdbook build "$src"
          echo "BOOK_DIR=$src/book" >> "$GITHUB_ENV"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.BOOK_DIR }}

  deploy:
    needs: build_release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
