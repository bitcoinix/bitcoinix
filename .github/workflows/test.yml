name: bitcoinix tests

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The Cachix signing key is passed only to the jobs that push to the cache
# (build_test_drivers, test_scenario, cache_flake_info). A secret that any step of a
# job references stays in the runner process for the whole job, so step scoping is
# not a boundary. nixos_search runs flake-info, a third-party binary, outside the
# Nix build sandbox and therefore gets no key at all.
permissions:
  contents: read

# Superseded PR revisions can be cancelled; each master push keeps its own run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Strategy:
# Job `build_test_drivers` evals all VM tests and builds all test drivers in a single Nix build.
# Compared to launching a separate build job for each VM test, this avoids duplicated
# builds of derivations that the test drivers have in common, when a signing key
# is available to share those builds through Cachix. Otherwise scenarios build directly.
#
# The job matrix `test_scenario` runs the VM tests.
# When job `build_test_drivers` determines that all tests have already been built successfully,
# job `test_scenario` is skipped via output variable `run_scenario_tests`.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      # The API caps file listings at 3000. Empty or potentially truncated lists
      # conservatively run all checks, as do all master pushes.
      docs_only: >-
        ${{ github.event_name == 'pull_request'
            && steps.paths.outputs.all == 'true'
            && steps.paths.outputs.all_count < 3000
            && steps.paths.outputs.docs_count == steps.paths.outputs.all_count }}
    steps:
      # Uses the PR files API, including both sides of renames; no checkout needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            # With 'every', no predicates matches every path, including newlines
            # that a '**' glob can miss. Skip only if all paths also match docs.
            all: []
            docs:
              - '{docs/**,theme/**,assets/**,README.md,dev/README.md,book.toml}'

  # VM integration tests
  build_test_drivers:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    env:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    outputs:
      run_scenario_tests: ${{ steps.main.outputs.run_scenario_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - id: main
        name: Build test drivers
        run: |
          echo "::group::Setup Nix env"
          nix shell --inputs-from . nixpkgs#{bash,coreutils,cachix} -c ./test/ci/build_test_drivers.sh

  test_scenario:
    runs-on: ubuntu-latest
    env:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    strategy:
      matrix:
        scenario:
          - default
          - netns
          - netnsRegtest
          - wireguard-lndconnect
          - setup-secrets
    needs: build_test_drivers
    if: needs.build_test_drivers.outputs.run_scenario_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Run VM scenario
        run: nix shell --inputs-from . nixpkgs#{bash,coreutils,cachix} -c ./test/ci/build.sh ${{ matrix.scenario }}

  # Fast checks
  check_flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check pinned package versions
        run: ./test/ci/check-versions.sh
      - name: Check flake and run fast tests
        run: nix flake check --all-systems
      - name: Evaluate the CVE scan target and scanner
        run: |
          nix eval --impure --raw --expr '(import ./test/ci/scan-node.nix).drvPath'
          nix eval --impure --raw --expr '(import ./test/ci/vulnix.nix).drvPath'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Lint shell scripts
        run: ./test/shellcheck.sh

  # NixOS package and option extraction
  nixos_search:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # `ci-test.sh` runs flake-info, a third-party binary, outside the Nix build
      # sandbox. This job has no signing key, so that binary cannot sign store paths.
      - name: Check package and option extraction
        run: ./test/nixos-search/ci-test.sh

  # Caches the flake-info build so that later runs of `nixos_search` fetch it instead
  # of compiling it. Runs only on master, builds inside the Nix sandbox and never runs
  # flake-info.
  cache_flake_info:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Configure flake-info caches
        run: |
          nix shell --inputs-from . nixpkgs#cachix -c cachix use bitcoinix
          nix shell --inputs-from . nixpkgs#cachix -c cachix use nixos-search
      - name: Build and cache flake-info
        run: |
          path=$(nix build --no-link --print-out-paths ./test/nixos-search#flake-info)
          nix shell --inputs-from . nixpkgs#cachix -c cachix push bitcoinix "$path"

  # Release tooling
  release_tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check release signing keys
        run: nix shell --inputs-from . nixpkgs#openssh -c ./test/release-keys-test.sh
      - name: Test fetch-release
        run: nix shell --inputs-from . nixpkgs#{git,openssh,gnutar} -c ./test/fetch-release-test.sh
      - name: Test make-release
        run: nix shell --inputs-from . nixpkgs#{git,openssh,gnutar} -c ./test/make-release-test.sh

  # Deployment examples
  # Builds every deployment example in examples/ with its deployment tool, against this
  # checkout, one step per example. A new deployment example must be added to
  # test/ci/deployment-examples.sh and get a step here.
  deployment_examples:
    needs: changes
    if: needs.changes.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Use the bitcoinix binary cache
        run: nix shell --inputs-from . nixpkgs#cachix -c cachix use bitcoinix
      - name: Build examples/flakes (nixos-rebuild)
        run: ./test/ci/deployment-examples.sh flakes
      # Also run when the previous example failed, to report every broken example
      - name: Build examples/colmena (Colmena)
        if: ${{ !cancelled() }}
        run: ./test/ci/deployment-examples.sh colmena

  # Required CI gate
  # Job `ci_gate` is the status check that the rulesets on master and on release tags
  # require. The matrix jobs report as `test_scenario (<scenario>)` when they run and as
  # `test_scenario` when skipped, so no `test_scenario` check name can be required directly.
  # Add new jobs to its `needs`.
  ci_gate:
    needs:
      - changes
      - build_test_drivers
      - test_scenario
      - check_flake
      - shellcheck
      - nixos_search
      - cache_flake_info
      - release_tooling
      - deployment_examples
    # Run even when a needed job failed, so that this check reports a failure instead of
    # being skipped (a skipped required check counts as passed)
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_SCENARIOS: ${{ needs.build_test_drivers.outputs.run_scenario_tests }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_TEST_DRIVERS: ${{ needs.build_test_drivers.result }}
          TEST_SCENARIO: ${{ needs.test_scenario.result }}
          CHECK_FLAKE: ${{ needs.check_flake.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          NIXOS_SEARCH: ${{ needs.nixos_search.result }}
          CACHE_FLAKE_INFO: ${{ needs.cache_flake_info.result }}
          RELEASE_TOOLING: ${{ needs.release_tooling.result }}
          DEPLOYMENT_EXAMPLES: ${{ needs.deployment_examples.result }}
        run: |
          echo "build_test_drivers: $BUILD_TEST_DRIVERS"
          echo "test_scenario: $TEST_SCENARIO"
          echo "check_flake: $CHECK_FLAKE"
          echo "shellcheck: $SHELLCHECK"
          echo "nixos_search: $NIXOS_SEARCH"
          echo "cache_flake_info: $CACHE_FLAKE_INFO"
          echo "release_tooling: $RELEASE_TOOLING"
          echo "deployment_examples: $DEPLOYMENT_EXAMPLES"
          [[ $CHANGES == success &&
             $CHECK_FLAKE == success &&
             $SHELLCHECK == success &&
             $RELEASE_TOOLING == success ]]
          if [[ $DOCS_ONLY == true ]]; then
              [[ $EVENT_NAME == pull_request &&
                 $BUILD_TEST_DRIVERS == skipped &&
                 $TEST_SCENARIO == skipped &&
                 $NIXOS_SEARCH == skipped &&
                 $DEPLOYMENT_EXAMPLES == skipped ]]
          else
              [[ $DOCS_ONLY == false &&
                 $BUILD_TEST_DRIVERS == success &&
                 $NIXOS_SEARCH == success &&
                 $DEPLOYMENT_EXAMPLES == success ]]
              # A skip is valid only when all scenario results were cached.
              if [[ $RUN_SCENARIOS == true ]]; then
                  [[ $TEST_SCENARIO == success ]]
              else
                  [[ $RUN_SCENARIOS == false && $TEST_SCENARIO == skipped ]]
              fi
          fi
          if [[ $EVENT_NAME == push ]]; then
              [[ $CACHE_FLAKE_INFO == success ]]
          else
              [[ $CACHE_FLAKE_INFO == skipped ]]
          fi
