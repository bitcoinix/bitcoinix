name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  # A push can introduce or resolve conflicts in PRs targeting any branch.
  push:
    branches: ['**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  labeler:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      # Keep this workflow free of PR checkouts or PR code execution: it has write access
      # even for pull requests from forks.
      - name: Label changed areas and definition additions and removals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Edit these lists to change which paths receive each label.
            // directories: includes every file below each directory (keep the trailing /).
            // files: exact repository-relative paths. names: filenames at any depth.
            // patterns: glob patterns, e.g. helper/update-flake.* (* stays within a filename).
            // Areas may overlap. Keep labels aligned with the repository's labels:
            // https://github.com/bitcoinix/bitcoinix/labels
            const areaRules = {
              'area: ci': {
                directories: [
                  '.github/',
                  'test/',
                  'dev/'
                ]
              },
              'area: docs': {
                directories: [
                  'docs/',
                  'examples/',
                  'assets/'
                ],
                files: [
                  'SECURITY.md',
                  'book.toml'
                ],
                names: [
                  'README.md'
                ]
              },
              'area: modules': {
                directories: [
                  'modules/'
                ],
                files: [
                  'pkgs/lib.nix'
                ]
              },
              'area: packages': {
                directories: [
                  'pkgs/'
                ],
                files: [
                  'flake.nix',
                  'flake.lock',
                  'default.nix',
                  'helper/update-fixed-output-derivation.sh'
                ],
                patterns: [
                  'helper/update-flake.*'
                ]
              },
              'area: release': {
                directories: [
                  'helper/release-keys/'
                ],
                files: [
                  'helper/fetch-release.sh',
                  'helper/make-release.sh',
                  'test/fetch-release-test.sh',
                  'test/make-release-test.sh',
                  'test/release-keys-test.sh',
                  'examples/nix-bitcoin-release.nix',
                  '.github/workflows/release.yml'
                ]
              }
            };

            const {matchesGlob} = require('node:path');
            function matchesPath(path, rule) {
              return (rule.directories ?? []).some(dir => path.startsWith(dir)) ||
                (rule.files ?? []).includes(path) ||
                (rule.names ?? []).includes(path.split('/').pop()) ||
                (rule.patterns ?? []).some(pattern => matchesGlob(path, pattern));
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const labels = new Set();
            for (const {filename, status} of files) {
              for (const [label, rule] of Object.entries(areaRules)) {
                if (matchesPath(filename, rule)) labels.add(label);
              }

              const isModule = /^modules\/.+\.nix$/.test(filename);
              const isPackage = /^pkgs\/.+\.nix$/.test(filename);
              if (!isModule && !isPackage) continue;

              if (status === 'added') labels.add('type: feature');
              if (status === 'removed') labels.add('type: removal');
            }
            // Only add area/type labels here; the rebase job manages its status label.
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [...labels]
              });
            }

  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize label updates. Every run checks all open PRs, so replacing a pending
    # run with a newer event cannot lose a check for a different PR or base branch.
    concurrency:
      group: pull-request-rebase-labels
      cancel-in-progress: false
    steps:
      # API only, including for fork PRs: never check out or execute PR code here.
      - name: Update merge conflict labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = 'status: rebase needed';
            const {setTimeout: sleep} = require('node:timers/promises');
            let pending = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: 'open',
              per_page: 100
            });

            // GitHub computes mergeability asynchronously. Retry unknown results
            // in batches so one slow PR does not delay checks of the others.
            for (let attempt = 0; attempt < 5 && pending.length > 0; attempt++) {
              if (attempt > 0) await sleep(5000);
              const retry = [];
              for (const {number} of pending) {
                const {data: pr} = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: number
                });
                if (pr.state !== 'open') continue;
                if (typeof pr.mergeable !== 'boolean') {
                  retry.push(pr);
                  continue;
                }

                // mergeable describes conflicts with this PR's current base.
                // mergeable_state also reflects checks/reviews and being behind.
                const hasLabel = pr.labels.some(item => item.name === label);
                if (!pr.mergeable && !hasLabel) {
                  await github.rest.issues.addLabels({
                    ...context.repo,
                    issue_number: number,
                    labels: [label]
                  });
                } else if (pr.mergeable && hasLabel) {
                  try {
                    await github.rest.issues.removeLabel({
                      ...context.repo,
                      issue_number: number,
                      name: label
                    });
                  } catch (error) {
                    // A maintainer may have already removed it since the GET.
                    if (error.status !== 404) throw error;
                  }
                }
              }
              pending = retry;
            }
            for (const {number} of pending) {
              core.warning(`PR #${number}: mergeability is still unknown; keeping labels unchanged until the next run.`);
            }
