name: Verify release tags

# A bitcoinix release is a signed, annotated git tag. This verifies the latest release
# tag with helper/fetch-release.sh, run without releaseVersion= so that it picks the
# tag exactly as users get it by default. See SECURITY.md.
#
# Only the latest tag is checked: release tags are protected (no deletion, no
# force-push), so older tags cannot change. Re-checking them would only fail forever
# once a key is revoked, since the tags it signed stay in place.
#
# The trusted files (the key files, fetch-release.sh and the flake lock that pins the
# tools) are always taken from master, never from the tag being checked: a tag must
# not be able to vouch for itself by adding its own key.
#
# On a tag push, GitHub runs this workflow file as it is in the pushed tag's commit.
# That run gives quick feedback on honest mistakes, but whoever pushes a malicious tag
# can also change the workflow. Scheduled and manual runs always use the workflow file
# from the default branch, so the daily run is the check that a pushed tag cannot alter.

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Verify the latest release tag with the tooling from master
        # An explicit `shell: bash` runs with `-eo pipefail`, the default only has `-e`
        shell: bash
        run: |
          git fetch -q --no-tags origin +refs/heads/master:refs/remotes/origin/master
          trusted=$RUNNER_TEMP/trusted
          mkdir -p "$trusted"
          git archive origin/master | tar -x -C "$trusted"
          echo "Trusted files from master $(git rev-parse origin/master)"

          # Same tag selection as fetch-release.sh, which fails if there is none
          releases=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -z $releases ]]; then
              echo "No release tags yet"
              exit 0
          fi

          # The tools mirror the nix-shell shebang of fetch-release.sh
          repoUrl="file://$GITHUB_WORKSPACE" \
              nix shell --inputs-from "path:$trusted" \
                  nixpkgs#{bash,coreutils,git,gnugrep,gnused,gnutar,openssh} \
                  -c bash "$trusted/helper/fetch-release.sh"
      - name: Check release tag names
        # fetch-release.sh ignores tags that are not vX.Y.Z, so flag them here
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=0
          while read -r tag; do
              if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::$tag is not a valid release tag name (vX.Y.Z)"
                  failed=1
              fi
          done < <(git tag -l 'v*')
          exit "$failed"
